# Builds the CLI and the app bundle on pull requests and on pushes to main, and publishes
# build/Sharkbox-<version>.zip as a GitHub Release when a v* tag is pushed.
#
# The bundle is ad-hoc signed (see the Makefile). A downloaded copy trips Gatekeeper until the user
# clicks "Open Anyway" in System Settings or clears quarantine; Developer ID signing and notarisation
# need an Apple Developer account and are not done here.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # gh release create on tag pushes

jobs:
  build:
    # Apple silicon runner with the macOS 26 SDK, which is what the Makefile's plugin paths expect.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path

      - name: Read version from Info.plist
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches Info.plist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $VERSION"
            exit 1
          fi

      - name: Build and package
        run: make dist

      - name: Verify the bundle
        run: |
          build/shark version
          codesign --verify --deep --strict --verbose=2 build/Sharkbox.app
          codesign -d --entitlements - build/Sharkbox.app/Contents/MacOS/shark
          ls -l build/Sharkbox-*.zip

      # Upload the zip rather than the .app directory: upload-artifact does not keep executable bits.
      - uses: actions/upload-artifact@v7
        with:
          name: Sharkbox-${{ steps.version.outputs.version }}
          path: build/Sharkbox-*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" build/Sharkbox-*.zip --title "Sharkbox $VERSION" --generate-notes
